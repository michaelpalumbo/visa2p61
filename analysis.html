<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git Labyrinth</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inconsolata:wght@300;400;500&display=swap');

:root {
  --paper: #f5f0e8;
  --paper-dark: #ede8dc;
  --ink: #1a1410;
  --ink-mid: #4a3f35;
  --ink-faint: #9a8f85;
  --ink-ghost: #cfc9be;
  --accent: #8b2500;
  --border: #cfc9be;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Libre Baskerville', serif;
  background: var(--paper);
  color: var(--ink);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px 200px;
}

/* ── Header ── */
header {
  display: flex;
  align-items: baseline;
  padding: 11px 24px 10px;
  border-bottom: 1px solid var(--border);
  background: var(--paper);
  flex-shrink: 0;
  gap: 0;
}

header h1 {
  font-family: 'Libre Baskerville', serif;
  font-size: 22px;
  font-weight: 700;
  font-style: italic;
  color: var(--ink);
  margin-right: 20px;
  white-space: nowrap;
  flex-shrink: 0;
}
header h1 em { color: var(--accent); font-style: italic; }

#repo-tabs {
  display: flex;
  gap: 0;
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
  flex: 1;
  border-left: 1px solid var(--border);
}
#repo-tabs::-webkit-scrollbar { display: none; }

.repo-tab {
  font-family: 'Inconsolata', monospace;
  font-size: 15px;
  padding: 6px 18px;
  border: none;
  border-right: 1px solid var(--border);
  background: transparent;
  color: var(--ink-faint);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.12s;
  flex-shrink: 0;
}
.repo-tab:hover { color: var(--ink-mid); background: var(--paper-dark); }
.repo-tab.active {
  color: var(--ink);
  background: var(--paper-dark);
  font-weight: 500;
  position: relative;
}
.repo-tab.active::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
}

.view-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-left: 16px;
  flex-shrink: 0;
  align-self: center;
}
.view-btn {
  font-family: 'Inconsolata', monospace;
  font-size: 14px;
  letter-spacing: 0.06em;
  padding: 6px 16px;
  border: none;
  background: transparent;
  color: var(--ink-faint);
  cursor: pointer;
  transition: all 0.12s;
}
.view-btn + .view-btn { border-left: 1px solid var(--border); }
.view-btn.active { background: var(--ink); color: var(--paper); }
.view-btn:hover:not(.active) { background: var(--paper-dark); color: var(--ink-mid); }

/* ── Main ── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
}

/* ── Art canvas ── */
#art-container {
  flex: 1;
  overflow: hidden;
  position: relative;
}
#art-svg { width: 100%; height: 100%; }

/* ── Detail view ── */
#dag-container {
  flex: 1;
  overflow: hidden;
  position: relative;
  display: none;
}
#dag-container.visible { display: block; }
#dag-svg { width: 100%; height: 100%; }

/* ── Slide-in commit panel ── */
#detail-panel {
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 290px;
  background: var(--paper);
  border-left: 1px solid var(--border);
  padding: 22px 20px 22px 22px;
  transform: translateX(100%);
  transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 20;
  overflow-y: auto;
  box-shadow: -6px 0 28px rgba(26,20,16,0.07);
}
#detail-panel.open { transform: translateX(0); }

.dp-close {
  position: absolute;
  top: 12px; right: 12px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 3px;
  width: 22px; height: 22px;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink-faint);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.1s;
  line-height: 1;
}
.dp-close:hover { color: var(--ink); border-color: var(--ink-mid); }

.dp-type {
  display: inline-block;
  font-family: 'Inconsolata', monospace;
  font-size: 13px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 2px;
  margin-bottom: 14px;
}
.dp-type.merge  { background: #f9edd8; color: #7a4500; border: 1px solid #d4a050; }
.dp-type.root   { background: #dbeadb; color: #1a4a2e; border: 1px solid #5a9a70; }
.dp-type.normal { background: var(--paper-dark); color: var(--ink-mid); border: 1px solid var(--border); }

.dp-label {
  font-family: 'Inconsolata', monospace;
  font-size: 13px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 4px;
  margin-top: 14px;
}
.dp-hash {
  font-family: 'Inconsolata', monospace;
  font-size: 15px;
  color: var(--accent);
  word-break: break-all;
  line-height: 1.5;
}
.dp-subject {
  font-size: 16px;
  font-style: italic;
  color: var(--ink);
  line-height: 1.55;
}
.dp-meta {
  font-family: 'Inconsolata', monospace;
  font-size: 14px;
  color: var(--ink-mid);
  line-height: 1.8;
}
.dp-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 14px 0 0;
}
.dp-pills {
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px;
}
.dp-pill {
  font-family: 'Inconsolata', monospace;
  font-size: 13px;
  padding: 3px 9px;
  border-radius: 2px;
  color: var(--paper);
  font-weight: 500;
}

/* ── Info strip ── */
#info-strip {
  position: absolute;
  bottom: 18px; left: 18px;
  background: rgba(245,240,232,0.88);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 9px 13px;
  font-family: 'Inconsolata', monospace;
  font-size: 14px;
  color: var(--ink-mid);
  line-height: 1.9;
  backdrop-filter: blur(6px);
  z-index: 5;
  pointer-events: none;
}
#info-strip .s-author {
  font-family: 'Libre Baskerville', serif;
  font-style: italic;
  font-size: 17px;
  color: var(--ink);
  margin-bottom: 1px;
}
#info-strip .s-val { color: var(--ink); }

/* ── API hint ── */
#api-hint {
  position: absolute;
  bottom: 18px; left: 50%; transform: translateX(-50%);
  font-family: 'Inconsolata', monospace;
  font-size: 13px;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
  pointer-events: none;
  white-space: nowrap;
  background: rgba(245,240,232,0.8);
  padding: 4px 12px;
  border: 1px solid var(--border);
  border-radius: 3px;
  backdrop-filter: blur(4px);
}
#api-hint code {
  font-family: 'Inconsolata', monospace;
  color: var(--accent);
}

/* ── Zoom controls ── */
.zoom-controls {
  position: absolute;
  bottom: 18px; right: 18px;
  display: flex; flex-direction: column; gap: 3px;
  z-index: 5;
}
.zoom-btn {
  width: 36px; height: 36px;
  background: rgba(245,240,232,0.88);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--ink-mid);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.1s;
  font-family: monospace;
  backdrop-filter: blur(4px);
}
.zoom-btn:hover { background: var(--paper-dark); color: var(--ink); }

/* ── Hover tooltip ── */
#hover-tip {
  position: fixed;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 10px 14px;
  font-family: 'Inconsolata', monospace;
  font-size: 14px;
  line-height: 1.75;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.1s;
  max-width: 320px;
  z-index: 300;
  box-shadow: 0 4px 18px rgba(26,20,16,0.11);
  color: var(--ink-mid);
}
#hover-tip.on { opacity: 1; }
#hover-tip .th { color: var(--accent); font-weight: 500; }
#hover-tip .ts { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 14px; color: var(--ink); }
</style>
</head>
<body>

<header>
  <h1>git <em>labyrinth</em></h1>
  <div id="repo-tabs"></div>
  <div class="view-toggle">
    <button class="view-btn active" id="btn-art">labyrinth</button>
    <button class="view-btn" id="btn-dag">detail</button>
  </div>
  <div class="view-toggle" style="margin-left:8px">
    <button class="view-btn" id="btn-arrows" title="Toggle direction arrows on edges">arrows</button>
  </div>
</header>

<div class="main">

  <!-- Art / labyrinth view -->
  <div id="art-container">
    <svg id="art-svg"></svg>
    <div id="info-strip">
      <div class="s-author" id="strip-author"></div>
      <div id="strip-stats"></div>
    </div>
    <div id="api-hint">json endpoint: <code>data.json</code></div>
    <div class="zoom-controls">
      <button class="zoom-btn" id="az-in">+</button>
      <button class="zoom-btn" id="az-fit">⊡</button>
      <button class="zoom-btn" id="az-out">−</button>
    </div>
    <!-- Slide-in commit detail -->
    <div id="detail-panel">
      <button class="dp-close" id="dp-close">×</button>
      <div id="dp-content"></div>
    </div>
  </div>

  <!-- Dagre detail view -->
  <div id="dag-container">
    <svg id="dag-svg"></svg>
    <div class="zoom-controls">
      <button class="zoom-btn" id="dz-in">+</button>
      <button class="zoom-btn" id="dz-fit">⊡</button>
      <button class="zoom-btn" id="dz-out">−</button>
    </div>
  </div>

</div>

<div id="hover-tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script>
// ═══════════════════════════════════════
// PALETTE — muted ink colours
// ═══════════════════════════════════════
const PAL = [
  '#8b2500','#1a4a2e','#1a2a4a','#5a1a4a','#3d3a00',
  '#004a4a','#6a3000','#002a4a','#4a001a','#1a3a00',
  '#622800','#002244','#3a0018','#004422','#4a3800',
];

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
let repo = null;
let artZoom = null, dagZoom = null;
let view = 'art';
let selHash = null;
let showArrows = false;

// ═══════════════════════════════════════
// BOOTSTRAP
// ═══════════════════════════════════════
fetch('data.json')
  .then(r => { if (!r.ok) throw new Error('Cannot load data.json — place it alongside index.html'); return r.json(); })
  .then(data => {
    buildTabs(data);
    pickRepo(data[0]);

    document.getElementById('btn-art').onclick = () => switchView('art', data);
    document.getElementById('btn-dag').onclick  = () => switchView('dag', data);
    document.getElementById('dp-close').onclick = closePanel;

    const arrowBtn = document.getElementById('btn-arrows');
    arrowBtn.onclick = () => {
      showArrows = !showArrows;
      arrowBtn.classList.toggle('active', showArrows);
      if (view === 'art') drawArt(repo);
    };

    document.getElementById('az-in').onclick  = () => d3.select('#art-svg').call(artZoom.scaleBy, 1.35);
    document.getElementById('az-out').onclick = () => d3.select('#art-svg').call(artZoom.scaleBy, 0.74);
    document.getElementById('az-fit').onclick = fitArt;
    document.getElementById('dz-in').onclick  = () => d3.select('#dag-svg').call(dagZoom.scaleBy, 1.35);
    document.getElementById('dz-out').onclick = () => d3.select('#dag-svg').call(dagZoom.scaleBy, 0.74);
    document.getElementById('dz-fit').onclick = fitDag;
  })
  .catch(err => {
    document.getElementById('art-container').innerHTML +=
      `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
       font-family:Inconsolata,monospace;font-size:13px;color:#8b2500;padding:40px;text-align:center">
       ${err.message}</div>`;
  });

function buildTabs(data) {
  const c = document.getElementById('repo-tabs');
  data.forEach((r, i) => {
    const b = document.createElement('button');
    b.className = 'repo-tab' + (i === 0 ? ' active' : '');
    b.textContent = r.repo;
    b.onclick = () => {
      document.querySelectorAll('.repo-tab').forEach(t => t.classList.remove('active'));
      b.classList.add('active');
      pickRepo(r);
    };
    c.appendChild(b);
  });
}

function pickRepo(r) {
  repo = r; selHash = null; closePanel();
  document.getElementById('strip-author').textContent = r.author || r.repo;
  document.getElementById('strip-stats').innerHTML =
    `<span class="s-val">${r.commits.length}</span> commits · <span class="s-val">${r.branches.length}</span> branches`;
  if (view === 'art') drawArt(r);
  else drawDag(r);
}

function switchView(v, data) {
  view = v;
  document.getElementById('btn-art').classList.toggle('active', v === 'art');
  document.getElementById('btn-dag').classList.toggle('active',  v === 'dag');
  document.getElementById('art-container').style.display = v === 'art' ? '' : 'none';
  document.getElementById('dag-container').classList.toggle('visible', v === 'dag');
  closePanel();
  if (v === 'art') drawArt(repo);
  else drawDag(repo);
}

// ═══════════════════════════════════════
// COLOUR HELPERS
// ═══════════════════════════════════════
function branchColors(branches) {
  const m = {};
  branches.forEach((b, i) => { m[b.name] = PAL[i % PAL.length]; });
  return m;
}

function commitColors(commits, branches) {
  const cm = branchColors(branches);
  const commitMap = {};
  commits.forEach(c => { commitMap[c.hash] = c; });
  const out = {};
  // Walk from each branch tip; first assignment wins
  branches.forEach(b => {
    const col = cm[b.name];
    const seen = new Set();
    const q = [b.hash];
    while (q.length) {
      const h = q.shift();
      if (!h || seen.has(h) || !commitMap[h]) continue;
      seen.add(h);
      if (!out[h]) out[h] = col;
      commitMap[h].parents.forEach(p => q.push(p));
    }
  });
  return out;
}

// ═══════════════════════════════════════
// ART VIEW — radial organic
// ═══════════════════════════════════════
function drawArt(r) {
  const svg = d3.select('#art-svg');
  svg.selectAll('*').remove();
  if (!r.commits.length) return;

  const el = document.getElementById('art-svg');
  const W = el.clientWidth, H = el.clientHeight;
  const cx = W / 2, cy = H / 2;

  const commitMap = {};
  r.commits.forEach(c => { commitMap[c.hash] = c; });

  const tipMap = {};
  r.branches.forEach(b => { (tipMap[b.hash] = tipMap[b.hash] || []).push(b.name); });

  const cm = branchColors(r.branches);
  const cc = commitColors(r.commits, r.branches);

  const allHashes = new Set(r.commits.map(c => c.hash));

  // children map
  const kids = {};
  r.commits.forEach(c => { kids[c.hash] = []; });
  r.commits.forEach(c => { c.parents.forEach(p => { if (kids[p]) kids[p].push(c.hash); }); });

  // roots
  const roots = r.commits.filter(c =>
    c.parents.length === 0 || c.parents.every(p => !allHashes.has(p))
  );

  // subtree sizes for proportional arcs
  const sz = {};
  function calcSz(h, vis = new Set()) {
    if (vis.has(h)) return 0; vis.add(h);
    sz[h] = 1 + (kids[h] || []).reduce((s, k) => s + calcSz(k, vis), 0);
    return sz[h];
  }
  roots.forEach(ro => calcSz(ro.hash));

  // ── position assignment ──────────────────────────────────
  const pos = {};
  const STEP = 154;
  const MIN_ARC = 0.5;

  // Seed roots
  const bfsQ = [];
  if (roots.length === 1) {
    pos[roots[0].hash] = { x: cx, y: cy, depth: 0, angle: -Math.PI / 2 };
    bfsQ.push({ hash: roots[0].hash, dir: -Math.PI / 2, spread: Math.PI });
  } else {
    roots.forEach((ro, i) => {
      const a = (2 * Math.PI * i) / roots.length;
      pos[ro.hash] = { x: cx + Math.cos(a) * 28, y: cy + Math.sin(a) * 28, depth: 0, angle: a };
      bfsQ.push({ hash: ro.hash, dir: a, spread: Math.PI / roots.length + 0.3 });
    });
  }

  const placed = new Set(roots.map(ro => ro.hash));

  while (bfsQ.length) {
    const { hash, dir, spread } = bfsQ.shift();
    const node = pos[hash];
    const ch = (kids[hash] || []).filter(h => commitMap[h] && !placed.has(h));
    if (!ch.length) continue;

    // Mark placed first to avoid re-queuing
    ch.forEach(h => placed.add(h));

    if (ch.length === 1) {
      // Single child: gently drift using hash entropy
      const entropy = (parseInt(ch[0].slice(0, 4), 16) / 65535 - 0.5);
      const newDir = dir + entropy * 0.5;
      const depth = node.depth + 1;
      pos[ch[0]] = {
        x: cx + Math.cos(newDir) * depth * STEP,
        y: cy + Math.sin(newDir) * depth * STEP,
        depth, angle: newDir,
      };
      bfsQ.push({ hash: ch[0], dir: newDir, spread: spread * 0.9 });
    } else {
      // Multiple children: fan symmetrically around dir
      const total = ch.reduce((s, h) => s + (sz[h] || 1), 0);
      const totalArc = Math.min(spread * 2, Math.PI * 1.7);
      let cursor = dir - totalArc / 2;

      ch.forEach(childHash => {
        const fraction = (sz[childHash] || 1) / total;
        const arc = Math.max(MIN_ARC, fraction * totalArc);
        const childDir = cursor + arc / 2;
        cursor += arc;

        const depth = node.depth + 1;
        pos[childHash] = {
          x: cx + Math.cos(childDir) * depth * STEP,
          y: cy + Math.sin(childDir) * depth * STEP,
          depth, angle: childDir,
        };
        bfsQ.push({ hash: childHash, dir: childDir, spread: arc / 2 + 0.1 });
      });
    }
  }

  // Scatter any unplaced (disconnected) commits
  let sc = 0;
  r.commits.forEach(c => {
    if (!pos[c.hash]) {
      const a = sc * 0.8, rad = STEP * 5;
      pos[c.hash] = { x: cx + Math.cos(a) * rad, y: cy + Math.sin(a) * rad, depth: 5, angle: a };
      sc++;
    }
  });

  // ── SVG ─────────────────────────────────────────────────
  const defs = svg.append('defs');

  // Paper roughness displacement
  defs.append('filter').attr('id', 'rough')
    .html(`<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" result="n"/>
           <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>`);

  // Arrowhead marker for edges
  defs.append('marker')
    .attr('id', 'art-arrow')
    .attr('viewBox', '0 -5 10 10')
    .attr('refX', 10).attr('refY', 0)
    .attr('markerWidth', 5).attr('markerHeight', 10)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M0,-5L10,0L0,5')
    .attr('fill', 'var(--ink-mid)')
    .attr('opacity', 1);

  // Soft glow for selected node
  const glowF = defs.append('filter').attr('id', 'glow').attr('x','-40%').attr('y','-40%').attr('width','180%').attr('height','180%');
  glowF.append('feGaussianBlur').attr('stdDeviation','3').attr('result','b');
  glowF.append('feMerge').html('<feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>');

  const root = svg.append('g');

  artZoom = d3.zoom().scaleExtent([0.06, 5])
    .on('zoom', e => root.attr('transform', e.transform));
  svg.call(artZoom);

  // Edges
  const eG = root.append('g');
  r.commits.forEach(c => {
    c.parents.forEach(p => {
      if (!pos[c.hash] || !pos[p]) return;
      const s = pos[p], d = pos[c.hash];
      const dx = d.x - s.x, dy = d.y - s.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const bend = (parseInt(c.hash.slice(4, 6), 16) / 255 - 0.5) * dist * 0.32;
      const mx = (s.x + d.x) / 2 - (dy / dist) * bend;
      const my = (s.y + d.y) / 2 + (dx / dist) * bend;

      const col = cc[c.hash] || cc[p] || 'var(--ink-mid)';
      const isMerge = c.parents.length > 1;

      eG.append('path')
        .attr('d', `M${s.x},${s.y} Q${mx},${my} ${d.x},${d.y}`)
        .attr('fill', 'none')
        .attr('stroke', col)
        .attr('stroke-width', isMerge ? 30 : 30)
        .attr('stroke-opacity', 0.6)
        .attr('stroke-dasharray', isMerge ? '6,4' : null)
        .attr('marker-end', showArrows ? 'url(#art-arrow)' : null)
        .attr('filter', 'url(#rough)');
    });
  });

  // Nodes
  const nG = root.append('g');
  r.commits.forEach(c => {
    const p = pos[c.hash];
    if (!p) return;

    const col   = cc[c.hash] || 'var(--ink-mid)';
    const isMerge = c.parents.length > 1;
    const isRoot  = c.parents.length === 0 || c.parents.every(par => !allHashes.has(par));
    const tips    = tipMap[c.hash] || [];
    const isSel   = c.hash === selHash;

    const g = nG.append('g')
      .attr('transform', `translate(${p.x},${p.y})`)
      .style('cursor', 'pointer');

    // Halo for merge / root / selected
    if (isMerge || isRoot || isSel) {
      g.append('circle')
        .attr('r', isSel ? 42 : isMerge ? 47 : 40)
        .attr('fill', 'none')
        .attr('stroke', col)
        .attr('stroke-width', isSel ? 3 : 1.4)
        .attr('stroke-opacity', isSel ? 0.9 : 0.35);
    }

    // Dot
    const dotR = isRoot ? 40 : isMerge ? 40 : tips.length ? 43 : 43;
    g.append('circle')
      .attr('r', dotR)
      .attr('fill', isSel || tips.length ? col : 'var(--paper)')
      .attr('stroke', col)
      .attr('stroke-width', (isSel || tips.length) ? 0 : 2.4)
      .attr('filter', isSel ? 'url(#glow)' : null);

    // Branch name label (tip commits only)
    if (tips.length) {
      const label = tips[0].length > 15 ? tips[0].slice(0, 14) + '…' : tips[0];
      const away = Math.atan2(p.y - cy, p.x - cx);
      const off = dotR + 13;
      const lx = Math.cos(away) * off, ly = Math.sin(away) * off;
      g.append('text')
        .attr('x', lx).attr('y', ly + 3.5)
        .attr('font-family', 'Inconsolata, monospace')
        .attr('font-size', 148)
        .attr('font-weight', 500)
        .attr('fill', col)
        .attr('text-anchor', lx < -2 ? 'end' : lx > 2 ? 'start' : 'middle')
        .attr('opacity', 1)
        .text(label);
    }

    // Events
    g.on('mouseenter', evt => showTip(evt, c, tips, cm))
     .on('mousemove',  moveHoverTip)
     .on('mouseleave', hideTip)
     .on('click', (evt) => {
       // Cmd/Ctrl+click or middle-click → open GitHub in new tab
       if (evt.metaKey || evt.ctrlKey) {
         if (r.remoteUrl) window.open(`${r.remoteUrl}/commit/${c.hash}`, '_blank');
         return;
       }
       // Regular click → open detail panel
       selHash = selHash === c.hash ? null : c.hash;
       if (selHash) openPanel(c, tips, cm, r.remoteUrl);
       else closePanel();
       drawArt(r);
     });
  });

  fitArt();
}

function fitArt() {
  const el = document.getElementById('art-svg');
  const g  = d3.select('#art-svg g');
  if (!g.node()) return;
  try {
    const b = g.node().getBBox();
    if (!b.width || !b.height) return;
    const W = el.clientWidth, H = el.clientHeight, pad = 55;
    const sc = Math.min((W - pad * 2) / b.width, (H - pad * 2) / b.height, 1.3);
    const tx = (W - b.width * sc) / 2 - b.x * sc;
    const ty = (H - b.height * sc) / 2 - b.y * sc;
    d3.select('#art-svg').call(artZoom.transform, d3.zoomIdentity.translate(tx, ty).scale(sc));
  } catch(e) {}
}

// ═══════════════════════════════════════
// DAGRE DETAIL VIEW
// ═══════════════════════════════════════
function drawDag(r) {
  const svg = d3.select('#dag-svg');
  svg.selectAll('*').remove();
  if (!r.commits.length) return;

  const commitMap = {};
  r.commits.forEach(c => { commitMap[c.hash] = c; });
  const tipMap = {};
  r.branches.forEach(b => { (tipMap[b.hash] = tipMap[b.hash] || []).push(b.name); });
  const cm = branchColors(r.branches);

  const g = new dagre.graphlib.Graph();
  g.setGraph({ rankdir: 'TB', ranksep: 48, nodesep: 22, marginx: 40, marginy: 40 });
  g.setDefaultEdgeLabel(() => ({}));

  const NW = 184, NH = 52;
  r.commits.forEach(c => g.setNode(c.hash, { width: NW, height: NH }));
  r.commits.forEach(c => c.parents.forEach(p => { if (commitMap[p]) g.setEdge(p, c.hash); }));
  dagre.layout(g);

  const el = document.getElementById('dag-svg');
  const W = el.clientWidth, H = el.clientHeight;

  const defs = svg.append('defs');
  defs.append('marker').attr('id','arr2').attr('viewBox','0 -4 8 8')
    .attr('refX',8).attr('refY',0).attr('markerWidth',5).attr('markerHeight',5).attr('orient','auto')
    .append('path').attr('d','M0,-4L8,0L0,4').attr('fill','var(--ink-ghost)');

  const cont = svg.append('g');
  dagZoom = d3.zoom().scaleExtent([0.06, 4]).on('zoom', e => cont.attr('transform', e.transform));
  svg.call(dagZoom);

  // Edges
  g.edges().forEach(e => {
    const pts = g.edge(e).points;
    cont.append('path')
      .attr('d', d3.line().x(d => d.x).y(d => d.y).curve(d3.curveBasis)(pts))
      .attr('fill', 'none').attr('stroke', 'var(--border)').attr('stroke-width', 1.1)
      .attr('marker-end', 'url(#arr2)');
  });

  // Nodes
  g.nodes().forEach(hash => {
    const nd = g.node(hash);
    const c = commitMap[hash]; if (!c) return;
    const isMerge = c.parents.length > 1;
    const isRoot  = c.parents.length === 0;
    const tips = tipMap[hash] || [];
    const col = tips.length ? (cm[tips[0]] || 'var(--ink)') : 'var(--ink-mid)';

    const ng = cont.append('g').attr('transform', `translate(${nd.x - NW / 2},${nd.y - NH / 2})`);

    ng.append('rect').attr('width', NW).attr('height', NH).attr('rx', 3)
      .attr('fill', isMerge ? '#fbedd0' : isRoot ? '#dceadc' : 'var(--paper)')
      .attr('stroke', isMerge ? '#c8900a' : isRoot ? '#3a8a4a' : 'var(--border)')
      .attr('stroke-width', 1.1);

    ng.append('text').attr('x', 10).attr('y', 16)
      .attr('font-family', 'Inconsolata,monospace').attr('font-size', 10).attr('font-weight', 600)
      .attr('fill', col).text(c.hashShort);

    ng.append('text').attr('x', 10).attr('y', 30)
      .attr('font-family', 'Inconsolata,monospace').attr('font-size', 9.5)
      .attr('fill', 'var(--ink-mid)')
      .text(c.subject.length > 27 ? c.subject.slice(0, 26) + '…' : c.subject);

    ng.append('text').attr('x', 10).attr('y', 44)
      .attr('font-family', 'Inconsolata,monospace').attr('font-size', 9)
      .attr('fill', 'var(--ink-faint)').text(c.date);

    // Branch pills
    if (tips.length) {
      let px = 0;
      tips.forEach(name => {
        const short = name.length > 13 ? name.slice(0, 12) + '…' : name;
        const pw = short.length * 5.7 + 8;
        const pg = ng.append('g').attr('transform', `translate(${px},-14)`);
        pg.append('rect').attr('width', pw).attr('height', 12).attr('rx', 2).attr('fill', cm[name] || 'var(--ink)');
        pg.append('text').attr('x', 4).attr('y', 9)
          .attr('font-family', 'Inconsolata,monospace').attr('font-size', 8.5).attr('font-weight', 700)
          .attr('fill', 'var(--paper)').text(short);
        px += pw + 3;
      });
    }
  });

  fitDag();
}

function fitDag() {
  const el = document.getElementById('dag-svg');
  const g  = d3.select('#dag-svg g');
  if (!g.node()) return;
  try {
    const b = g.node().getBBox();
    if (!b.width || !b.height) return;
    const W = el.clientWidth, H = el.clientHeight, pad = 50;
    const sc = Math.min((W - pad * 2) / b.width, (H - pad * 2) / b.height, 1);
    d3.select('#dag-svg').call(dagZoom.transform,
      d3.zoomIdentity.translate((W - b.width * sc) / 2 - b.x * sc, pad - b.y * sc).scale(sc));
  } catch(e) {}
}

// ═══════════════════════════════════════
// DETAIL PANEL
// ═══════════════════════════════════════
function openPanel(c, tips, cm, remoteUrl) {
  const isMerge = c.parents.length > 1;
  const isRoot  = c.parents.length === 0;
  const typeClass = isMerge ? 'merge' : isRoot ? 'root' : 'normal';
  const typeLabel = isMerge ? 'merge commit' : isRoot ? 'root commit' : 'commit';

  const ghLink = remoteUrl
    ? `<hr class="dp-divider">
       <a href="${remoteUrl}/commit/${c.hash}" target="_blank" rel="noopener"
          style="display:inline-flex;align-items:center;gap:6px;margin-top:14px;
                 font-family:Inconsolata,monospace;font-size:13px;color:var(--accent);
                 text-decoration:none;border-bottom:1px solid var(--border);padding-bottom:2px">
         view on github ↗
       </a>`
    : '';

  document.getElementById('dp-content').innerHTML = `
    <span class="dp-type ${typeClass}">${typeLabel}</span>
    <div class="dp-label" style="margin-top:0">hash</div>
    <div class="dp-hash">${c.hash}</div>
    <hr class="dp-divider">
    <div class="dp-label">message</div>
    <div class="dp-subject">${esc(c.subject) || '<em style="color:var(--ink-faint)">no message</em>'}</div>
    <div class="dp-label">date</div>
    <div class="dp-meta">${c.date}</div>
    <div class="dp-label">author</div>
    <div class="dp-meta">${esc(c.author)}</div>
    ${tips.length ? `<div class="dp-label">branch tip${tips.length > 1 ? 's' : ''}</div>
    <div class="dp-pills">${tips.map(t =>
      `<span class="dp-pill" style="background:${cm[t]||'var(--ink)'}">${esc(t)}</span>`
    ).join('')}</div>` : ''}
    ${c.parents.length ? `<hr class="dp-divider">
    <div class="dp-label">parent${c.parents.length > 1 ? 's' : ''}</div>
    <div class="dp-meta">${c.parents.map(p =>
      `<span style="color:var(--accent)">${p.slice(0,7)}</span>`
    ).join('<br>')}</div>` : ''}
    ${ghLink}
  `;
  document.getElementById('detail-panel').classList.add('open');
}

function closePanel() {
  selHash = null;
  document.getElementById('detail-panel').classList.remove('open');
}

// ═══════════════════════════════════════
// HOVER TIP
// ═══════════════════════════════════════
function showTip(evt, c, tips, cm) {
  const col = tips.length ? (cm[tips[0]] || 'var(--accent)') : 'var(--accent)';
  const brStr = tips.length
    ? `<br><span style="color:${col};font-weight:500">${tips.join(', ')}</span>`
    : '';
  document.getElementById('hover-tip').innerHTML =
    `<span class="th">${c.hashShort}</span>  <span style="color:var(--ink-faint)">${c.date}</span>${brStr}<br><span class="ts">${esc(c.subject)}</span><br><span style="color:var(--ink-faint);font-size:11px">⌘/ctrl+click to open on github</span>`;
  document.getElementById('hover-tip').classList.add('on');
  moveHoverTip(evt);
}
function moveHoverTip(evt) {
  const t = document.getElementById('hover-tip');
  let x = evt.clientX + 14, y = evt.clientY + 14;
  if (x + 280 > window.innerWidth)  x -= 290;
  if (y + 90  > window.innerHeight) y -= 100;
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
function hideTip() { document.getElementById('hover-tip').classList.remove('on'); }

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
